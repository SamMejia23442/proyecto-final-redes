# nginx: sitio público de Ventas (DMZ). Reemplazar DOMINIO por el dominio público.
# Tras correr certbot, este archivo queda con HTTPS y redirección HTTP->HTTPS.
server {
    listen 80;
    server_name DOMINIO;
    root /var/www/ventas;
    index index.html;
    server_tokens off;

    location / {
        try_files $uri $uri/ =404;
    }
}
