# /etc/nginx/sites-available/ventas en vm-dmz-web, tal como quedó desplegado (17/11/2026).
# Certbot agregó el bloque 443 y la redirección 301; hardening-extra.sh agregó el include de cabeceras.
server {
    server_name agrosense-ventas-gt.brazilsouth.cloudapp.azure.com;
    root /var/www/ventas;
    index index.html;
    server_tokens off;
    include /etc/nginx/snippets/security-headers.conf;

    location / {
        try_files $uri $uri/ =404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/agrosense-ventas-gt.brazilsouth.cloudapp.azure.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/agrosense-ventas-gt.brazilsouth.cloudapp.azure.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = agrosense-ventas-gt.brazilsouth.cloudapp.azure.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name agrosense-ventas-gt.brazilsouth.cloudapp.azure.com;
    return 404; # managed by Certbot

}
