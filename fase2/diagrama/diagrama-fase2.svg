<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 92 1600 1000" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <g id="xm"><circle r="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.8"/><path d="M-4.6,-4.6 L4.6,4.6 M-4.6,4.6 L4.6,-4.6" stroke="#dc2626" stroke-width="2.6" stroke-linecap="round"/></g>
  </defs>
  <rect width="1600" height="1120" fill="#ffffff"/>

  <!-- Internet -->
  <rect x="1390" y="575" width="180" height="90" rx="45" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="1480" y="613" text-anchor="middle" font-size="19" font-weight="bold" fill="#14532d">Internet</text>
  <text x="1480" y="637" text-anchor="middle" font-size="12.5" fill="#475569">clientes y visitantes</text>

  <!-- VNet -->
  <rect x="30" y="110" width="1330" height="870" rx="16" fill="#fafbfc" stroke="#94a3b8" stroke-width="2"/>
  <text x="52" y="142" font-size="19" font-weight="bold" fill="#334155">vnet-agrosense-gt · 10.0.0.0/24 · Microsoft Azure (Brazil South)</text>
  <text x="52" y="164" font-size="13.5" fill="#64748b">DNS de la VNet (DHCP): 10.0.0.105 · Firewall de red: un NSG por subred · Firewall de host: ufw + hardening en cada VM</text>

  <!-- TI hacia todas -->
  <path d="M250,210 V192 H1120 V206" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ab)"/>
  <path d="M690,192 V206" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="760" y="186" font-size="13" font-weight="bold" fill="#1d4ed8">TI → todas las subredes (la conexión la inicia TI)</text>

  <!-- snet-ti -->
  <rect x="70" y="210" width="380" height="220" rx="12" fill="#eef4ff" stroke="#3b6fd8" stroke-width="2"/>
  <text x="90" y="240" font-size="19" font-weight="bold" fill="#1e3a8a">snet-ti</text>
  <text x="90" y="262" font-size="14" fill="#475569">10.0.0.64/27</text>
  <rect x="330" y="224" width="100" height="26" rx="13" fill="#ffffff" stroke="#3b6fd8"/>
  <text x="380" y="242" text-anchor="middle" font-size="13" fill="#1e3a8a">nsg-ti</text>
  <rect x="90" y="278" width="340" height="70" rx="8" fill="#ffffff" stroke="#93b4f0"/>
  <text x="260" y="306" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#0f172a">vm-cliente-01 · 10.0.0.68</text>
  <text x="260" y="328" text-anchor="middle" font-size="12.5" fill="#64748b">VM de pruebas (se mueve entre subredes)</text>
  <text x="90" y="372" font-size="12.5" fill="#1e3a8a">Entrada solo desde TI (Allow-TI-Intra)</text>
  <text x="90" y="392" font-size="12.5" fill="#b91c1c">Resto de la VNet: Deny-Inbound-VNet</text>
  <text x="90" y="412" font-size="12.5" fill="#475569">NSG stateful: TI sí inicia conexiones</text>

  <!-- snet-ventas -->
  <rect x="500" y="210" width="380" height="220" rx="12" fill="#f5f0ff" stroke="#7c4dce" stroke-width="2"/>
  <text x="520" y="240" font-size="19" font-weight="bold" fill="#4c1d95">snet-ventas</text>
  <text x="520" y="262" font-size="14" fill="#475569">10.0.0.0/27</text>
  <rect x="740" y="224" width="120" height="26" rx="13" fill="#ffffff" stroke="#7c4dce"/>
  <text x="800" y="242" text-anchor="middle" font-size="13" fill="#4c1d95">nsg-ventas</text>
  <rect x="520" y="278" width="340" height="70" rx="8" fill="#ffffff" stroke="#c4b2ee"/>
  <text x="690" y="306" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#0f172a">vm-cliente-01 · 10.0.0.4</text>
  <text x="690" y="328" text-anchor="middle" font-size="12.5" fill="#64748b">posición base de la VM de pruebas</text>
  <text x="520" y="372" font-size="12.5" fill="#4c1d95">DNS 10.0.0.105: resuelve rrhh.agrosense.local</text>
  <text x="520" y="392" font-size="12.5" fill="#4c1d95">Intranet por nombre (HTTP 80)</text>
  <text x="520" y="412" font-size="12.5" fill="#475569">Sin reglas propias (reglas por defecto)</text>

  <!-- snet-visitas -->
  <rect x="930" y="210" width="380" height="220" rx="12" fill="#fff1f1" stroke="#d64545" stroke-width="2"/>
  <text x="950" y="240" font-size="19" font-weight="bold" fill="#991b1b">snet-visitas</text>
  <text x="950" y="262" font-size="14" fill="#475569">10.0.0.32/27</text>
  <rect x="1170" y="224" width="120" height="26" rx="13" fill="#ffffff" stroke="#d64545"/>
  <text x="1230" y="242" text-anchor="middle" font-size="13" fill="#991b1b">nsg-visitas</text>
  <rect x="950" y="278" width="340" height="70" rx="8" fill="#ffffff" stroke="#f0a8a8"/>
  <text x="1120" y="306" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#0f172a">Red de invitados</text>
  <text x="1120" y="328" text-anchor="middle" font-size="12.5" fill="#64748b">solo Internet: TCP 80/443</text>
  <text x="950" y="372" font-size="12.5" fill="#b91c1c">Salida a la VNet: Deny-Internal-VNet</text>
  <text x="950" y="392" font-size="12.5" fill="#991b1b">DNS de Azure 168.63.129.16</text>
  <text x="950" y="412" font-size="12.5" fill="#475569">agrosense.local no existe para Visitas</text>

  <!-- Denegados fila 1 -->
  <line x1="498" y1="300" x2="455" y2="300" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <line x1="928" y1="300" x2="885" y2="300" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#ar)"/>

  <use xlink:href="#xm" x="476" y="300"/>
  <use xlink:href="#xm" x="906" y="300"/>
  <!-- Visitas hacia Internet -->
  <path d="M1310,300 H1480 V571" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
  <text x="1335" y="292" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#15803d">80/443</text>

  <!-- Flechas hacia el Data Center -->
  <line x1="230" y1="430" x2="230" y2="526" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="244" y="472" font-size="12.5" font-weight="bold" fill="#1d4ed8">SSH 22 · ICMP</text>
  <text x="244" y="490" font-size="12.5" font-weight="bold" fill="#1d4ed8">HTTP 80 · DNS 53</text>
  <line x1="640" y1="430" x2="640" y2="526" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="654" y="472" font-size="12.5" font-weight="bold" fill="#1d4ed8">HTTP 80 (intranet)</text>
  <text x="654" y="490" font-size="12.5" font-weight="bold" fill="#1d4ed8">DNS 53</text>
  <line x1="1040" y1="430" x2="1040" y2="526" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <text x="1060" y="472" font-size="12.5" font-weight="bold" fill="#b91c1c">Visitas → red interna</text>
  <text x="1060" y="490" font-size="12.5" font-weight="bold" fill="#b91c1c">denegado</text>

  <use xlink:href="#xm" x="1040" y="478"/>
  <!-- snet-datacenter -->
  <rect x="70" y="530" width="810" height="320" rx="12" fill="#edf8f1" stroke="#2f8a55" stroke-width="2"/>
  <text x="90" y="560" font-size="19" font-weight="bold" fill="#14532d">snet-datacenter</text>
  <text x="90" y="582" font-size="14" fill="#475569">10.0.0.96/28 · sin IP pública: no se alcanza desde Internet</text>
  <rect x="730" y="544" width="130" height="26" rx="13" fill="#ffffff" stroke="#2f8a55"/>
  <text x="795" y="562" text-anchor="middle" font-size="13" fill="#14532d">nsg-datacenter</text>
  <rect x="90" y="598" width="770" height="150" rx="10" fill="#ffffff" stroke="#86c9a1"/>
  <text x="110" y="624" font-size="14.5" font-weight="bold" fill="#14532d">vm-rrhh-web · ufw + hardening</text>
  <rect x="110" y="636" width="355" height="96" rx="8" fill="#f0fdf4" stroke="#2f8a55"/>
  <text x="287" y="663" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#0f172a">Intranet RRHH · nginx :80</text>
  <text x="287" y="686" text-anchor="middle" font-size="13" fill="#0f172a">10.0.0.106 · rrhh.agrosense.local</text>
  <text x="287" y="709" text-anchor="middle" font-size="12" fill="#475569">desde Ventas, TI y Data Center</text>
  <rect x="485" y="636" width="355" height="96" rx="8" fill="#f0fdf4" stroke="#2f8a55"/>
  <text x="662" y="663" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#0f172a">DNS interno · BIND9 :53</text>
  <text x="662" y="686" text-anchor="middle" font-size="13" fill="#0f172a">10.0.0.105 · ns1.agrosense.local</text>
  <text x="662" y="709" text-anchor="middle" font-size="12" fill="#475569">zonas agrosense.local y 0.0.10.in-addr.arpa</text>
  <text x="90" y="772" font-size="12.5" fill="#475569">Servidores del diseño de la Fase 1 (no desplegados en la prueba de concepto):</text>
  <g font-size="12" text-anchor="middle">
    <rect x="90" y="782" width="146" height="52" rx="7" fill="none" stroke="#86c9a1" stroke-dasharray="5 4"/>
    <text x="163" y="804" font-weight="bold" fill="#14532d">srv-mqtt-01</text><text x="163" y="822" fill="#475569">10.0.0.100</text>
    <rect x="246" y="782" width="146" height="52" rx="7" fill="none" stroke="#86c9a1" stroke-dasharray="5 4"/>
    <text x="319" y="804" font-weight="bold" fill="#14532d">srv-worker-02</text><text x="319" y="822" fill="#475569">10.0.0.101</text>
    <rect x="402" y="782" width="146" height="52" rx="7" fill="none" stroke="#86c9a1" stroke-dasharray="5 4"/>
    <text x="475" y="804" font-weight="bold" fill="#14532d">srv-tsdb-03</text><text x="475" y="822" fill="#475569">10.0.0.102</text>
    <rect x="558" y="782" width="146" height="52" rx="7" fill="none" stroke="#86c9a1" stroke-dasharray="5 4"/>
    <text x="631" y="804" font-weight="bold" fill="#14532d">srv-pg-04</text><text x="631" y="822" fill="#475569">10.0.0.103</text>
    <rect x="714" y="782" width="146" height="52" rx="7" fill="none" stroke="#86c9a1" stroke-dasharray="5 4"/>
    <text x="787" y="804" font-weight="bold" fill="#14532d">srv-api-05</text><text x="787" y="822" fill="#475569">10.0.0.104</text>
  </g>

  <!-- snet-dmz -->
  <rect x="930" y="530" width="380" height="320" rx="12" fill="#fff7ed" stroke="#e07b00" stroke-width="2"/>
  <text x="950" y="560" font-size="19" font-weight="bold" fill="#9a3412">snet-dmz</text>
  <text x="950" y="582" font-size="14" fill="#475569">10.0.0.112/28 (antes Reserva Futura A)</text>
  <rect x="1200" y="544" width="90" height="26" rx="13" fill="#ffffff" stroke="#e07b00"/>
  <text x="1245" y="562" text-anchor="middle" font-size="13" fill="#9a3412">nsg-dmz</text>
  <rect x="950" y="598" width="340" height="150" rx="8" fill="#ffffff" stroke="#f3b46b"/>
  <text x="1120" y="624" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#0f172a">vm-dmz-web · 10.0.0.116</text>
  <text x="1120" y="646" text-anchor="middle" font-size="13" fill="#0f172a">IP pública 191.232.198.113</text>
  <text x="1120" y="670" text-anchor="middle" font-size="12.5" fill="#9a3412">nginx: HTTP 80 → 301 → HTTPS 443</text>
  <text x="1120" y="691" text-anchor="middle" font-size="12.5" fill="#9a3412">certificado Let's Encrypt (punto extra)</text>
  <text x="1120" y="715" text-anchor="middle" font-size="12" fill="#475569">agrosense-ventas-gt.</text>
  <text x="1120" y="733" text-anchor="middle" font-size="12" fill="#475569">brazilsouth.cloudapp.azure.com</text>
  <text x="950" y="772" font-size="12.5" fill="#9a3412">SSH 22 solo desde TI (Allow-SSH-From-TI)</text>
  <text x="950" y="792" font-size="12.5" fill="#b91c1c">Salida a la VNet: Deny-DMZ-To-VNet</text>
  <text x="950" y="812" font-size="12.5" fill="#475569">ufw: 80/443 público, 22 solo desde TI</text>
  <text x="950" y="832" font-size="12.5" fill="#475569">usa el DNS de Azure (no el interno)</text>

  <!-- DMZ hacia la red interna (denegado) e Internet hacia la DMZ -->
  <line x1="928" y1="690" x2="885" y2="690" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <line x1="1390" y1="640" x2="1314" y2="640" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
  <text x="1335" y="630" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#15803d">80/443</text>

  <use xlink:href="#xm" x="906" y="690"/>
  <!-- Reserva -->
  <rect x="70" y="880" width="1240" height="76" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="690" y="914" text-anchor="middle" font-size="15" fill="#64748b">Reserva futura · 10.0.0.128/25</text>
  <text x="690" y="936" text-anchor="middle" font-size="12.5" fill="#94a3b8">123 IPs útiles para crecimiento</text>

  <!-- Leyenda -->
  <g font-size="13" fill="#334155">
    <line x1="40" y1="1018" x2="90" y2="1018" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ab)"/>
    <text x="100" y="1023">Permitido entre subredes</text>
    <line x1="300" y1="1018" x2="350" y2="1018" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
    <text x="360" y="1023">Permitido con Internet</text>
    <line x1="550" y1="1018" x2="600" y2="1018" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#ar)"/>
    <use xlink:href="#xm" x="575" y="1018"/>
    <text x="610" y="1023">Denegado por NSG</text>
    <rect x="790" y="1006" width="44" height="24" rx="6" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
    <text x="844" y="1023">Diseño o reserva (no desplegado)</text>
    <rect x="1100" y="1005" width="70" height="26" rx="13" fill="#ffffff" stroke="#64748b"/>
    <text x="1135" y="1023" text-anchor="middle" font-size="12.5">nsg-…</text>
    <text x="1180" y="1023">NSG asociado a la subred</text>
    <text x="40" y="1062" fill="#475569">Rojo en las notas = regla Deny del NSG. Además de los NSG, cada VM tiene ufw con "denegar todo lo entrante" y solo abre los puertos de su rol.</text>
  </g>
</svg>
